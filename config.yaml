# ============================================================
# 多站点多级页面抓取配置
#
# 抓取模式 (每个站点二选一):
#   A. levels: 预设层级的多级抓取 (见下方概念说明)
#   B. crawl:  递归抓取 —— 不知道页面有多少级时使用。
#      沿 links 选出的链接自动深入, 每访问一页都提取 targets,
#      直到没有新链接或达到 max_depth/max_pages 上限。
#
# 链式抽取 (CSS / XPath / 正则 串联, levels 和 crawl 的字段都可用):
#   简写:  title: "h1"                        -> 等价于 CSS 单步
#   单步:  title: "xpath://h1/a"  /  "regex:\\d+"
#   多步:  title:                              -> 逐步执行, 前一步结果是后一步的上下文
#     - "css:.content"                         # CSS 选中节点
#     - "xpath:./p[1]"                         # XPath 在上一步节点内选取 (.// 表示当前节点内)
#     - "regex:^([^.]+\\.)"                    # 正则对文本提取; 有分组取第 1 组
#   注意: regex 步骤之后不能再接 css/xpath; 步骤详解见 README
#
# 核心概念:
#   render: auto    -> 自动判断(默认): 先按静态抓取, 用选择器校验内容是否已存在,
#                      拿不到就自动切换 Playwright 动态渲染 (每个页面单独判断)
#          static  -> 强制直接请求 HTML (快, 适合确定的静态页面)
#          dynamic -> 强制 Playwright 渲染 (适合确定的 JS 渲染页面)
#   levels: 抓取层级, 从上到下逐层深入
#     - item_selector: 本层"每一项"的 CSS 选择器 (不写 = 整页作为一项)
#     - fields:        从每一项提取的字段
#         简写:  字段名: "css选择器"                        -> 取文本
#         详写:  字段名:
#                 selector: ".title"     CSS 选择器
#                 attr: "href"           取属性而非文本; href/src 自动补全为绝对链接
#                 html: true            保留内部 HTML (主要给 json 输出用)
#                 all: true             匹配所有元素并合并 (默认只取第一个)
#                 regex: "..."          用正则从值中再提取 (配合 regex_group)
#                 max_length: 200       截断过长文本
#                 default: "-"          未匹配时的默认值
#     - url_field:     【写在下一层】指定上一层的哪个字段作为本层的入口链接
#     - limit:         本层最多处理多少项 (防止抓取过量)
#     - wait_for:      (动态模式) 等待该选择器的元素出现后再提取
#     - settle:        (动态模式) 再额外等待的秒数, 给延迟加载的内容留时间
#     - render:        也可以写在某一层, 覆盖站点级设置 (如列表页静态、详情页动态)
#
# 运行: 由 .github/workflows/crawler.yml 定时触发, 结果写入 Gist
# ============================================================

# ---------- 全局设置 ----------
delay: 1.0 # 相邻两次请求的间隔秒数 (对目标站点友好, 建议不要小于 1)
timeout: 120 # 单个请求超时 (秒)
retry: 2 # 瞬时失败(超时/5xx/429)的重试次数: 静态请求指数退避, 动态渲染加载失败同样重试
timezone_offset: 8 # 输出内容里时间戳使用的时区偏移

# ---------- Gist 输出 ----------
# 固定地址机制:
#   1) 首次运行自动创建 Gist, ID 写入 gist_id.txt (workflow 会把它提交回仓库复用)
#   2) 之后每次运行都按固定文件名 (站点名.txt, 如 mibei77.txt) 原地更新同一个 Gist
#   3) Gist 地址永远不变 —— 收藏首次运行日志里打印的 html_url 即可;
#      程序/客户端订阅可用 raw 直链 (去掉中间的版本号段, 永远指向最新内容):
#      https://gist.githubusercontent.com/<用户名>/<gist_id>/raw/mibei77.txt
#   4) 忘了地址: Actions 任一次运行日志里搜 "已更新 Gist:" 即可找回,
#      或看仓库根目录的 gist_id.txt; secret Gist 知道链接即可访问 (无需登录),
#      但搜索引擎搜不到
#   最直接: 登录 GitHub 账号后直接访问 https://gist.github.com,
#      即可看到该账户下的所有 Gist, 点击对应条目即可查看抓取结果;
#      点进后地址栏 https://gist.github.com/<用户名>/<gist_id> 末段就是 gist_id
#      (gist_id.txt 里存的就是它), 需要拼 raw 直链或换仓库时可从这里复制
# 前置: 仓库 Secret 里需配置 GIST_TOKEN (classic PAT, 勾选 gist 权限); GIST_ID 可选
gist:
  id:
    "" # 留空: 首次运行会自动创建 Gist, 并把 ID 写入 gist_id.txt
    # 也可以在仓库 Secret 里配置 GIST_ID 指定已有 Gist (优先级更高)
  description: "mibei77 节点订阅链接" # 仅在首次创建 Gist 时生效, 之后改它不会更新已有 Gist

# ---------- 站点列表 (可配置任意多个) ----------
# name: 每个站点的必填标识, 决定 Gist 输出文件名 (清洗后的 name + 扩展名, 扩展名由 output.format 决定):
#   - 不能重复: 两个站点清洗后的 name 相同 -> 文件名相同, 同一个 Gist 里会互相覆盖
#   - 非法字符 \/:*?"<>| 和空白替换为 "-", 首尾 "-" 去掉, 清洗后为空兜底为 "site"
#   - 改名 = 换文件: 下次推送生成新文件, 旧文件作为残留被自动清理;
#     依赖固定 raw 直链订阅的 (如 mibei77.txt), 改名会使旧直链失效, 慎改
sites:
  # ======== 示例 1: 静态页面 + 两级抓取 (列表页 -> 作者详情页) ========
  # 以下三个示例站点仅作配置参考, 已停用 (不会抓取、不会写进 Gist);
  # 想重新启用改回 enabled: true 即可
  - name: quotes
    title: "经典语录·静态页示例"
    enabled: false # 停用: 避免示例数据混进正式 Gist
    start_url: https://quotes.toscrape.com/
    # start_urls:            # 也支持多个入口页
    #   - https://quotes.toscrape.com/
    #   - https://quotes.toscrape.com/page/2/
    render: auto # 自动判断: 本站静态即可, 不会启用浏览器
    # headers:               # 需要自定义请求头时打开 (如 Cookie)
    #   Cookie: "${QUOTES_COOKIE}" # 敏感值用 ${环境变量} 注入, 不要写死在仓库里
    levels:
      - name: list # 第一级: 列表页
        item_selector: ".quote" # 每条语录是一个 .quote
        limit: 5 # 只处理前 5 条
        fields:
          quote: ".text" # 简写: 取文本
          author: ".author"
          link:
            selector: "a" # 详写: 取 href 属性, 自动补全为绝对链接
            attr: "href"
      - name: detail # 第二级: 作者详情页
        url_field: link # 以上一层的 link 字段作为本层入口
        fields:
          name: "h3.author-title"
          born: ".author-born-date"
          about:
            selector: ".author-description"
            max_length: 120 # 过长的文本截断
    output:
      # format: txt -> 每条记录输出为一行 (推荐用于纯文本归档)
      #          markdown | json 也仍可选用
      format: txt
      separator: " | " # 行内字段值的分隔符, 也可用 "\t" (方便导入表格)
      # with_keys: true      # 行内带字段名, 如 "author: Albert Einstein"
      # inherit_fields: false # 不把上层字段拼进行内, 只保留最深层字段

  # ======== 示例 2: 自动判断渲染方式 + 两级抓取 ========
  # 该站第 1 级页面本身含分页链接(静态可取), 第 2 级页面由 JS 渲染(自动回退动态)。
  # 同一站点里两种渲染方式可以混用, 由 auto 逐页判断。
  - name: quotes-js
    title: "经典语录·动态页示例"
    enabled: false # 停用: 避免示例数据混进正式 Gist
    start_url: https://quotes.toscrape.com/js/
    render: auto
    levels:
      - name: first-page # 第一级: 整页作为一项
        fields:
          next_page:
            selector: "li.next a"
            attr: "href" # -> https://quotes.toscrape.com/js/page/2/
      - name: second-page # 第二级: 跟随上一层的 next_page 链接
        url_field: next_page
        item_selector: ".quote" # 静态抓取发现没有 .quote, 会自动切动态渲染
        settle: 1.0 # 切动态后额外等 1 秒
        fields:
          quote: ".text"
          author: ".author"
          tags:
            selector: ".tag" # 一条语录有多个标签
            all: true # 全部提取并合并
    output:
      format: txt # 该站点也输出 txt, 演示带字段名 + 不继承上层字段
      with_keys: true
      inherit_fields: false # 上一层的 next_page 链接不拼进每行

  # ======== 示例 3: 递归抓取 (未知层级) + CSS/XPath/正则链式抽取 ========
  # 不知道一共有多少页: 沿"下一页"链接自动深入, 每页提取所有语录,
  # 直到没有新链接 (或达到 max_depth / max_pages)
  - name: quotes-crawl
    title: "经典语录·递归抓取示例"
    enabled: false # 停用: 避免示例数据混进正式 Gist
    start_url: https://quotes.toscrape.com/
    render: auto
    crawl:
      # 每一页: 从这些链接继续深入 (链式选择器, 默认取 href 并转为绝对链接)
      links: "css:ul.pager a"
      # allow:                        # 可选: 只跟随匹配任一正则的链接
      #   - "^https://quotes\\.toscrape\\.com/page/\\d+/"
      deny: # 可选: 排除匹配的链接 (/page/1/ 与首页同页, 去重)
        - "/page/1/"
      same_host: true # 默认只跟随同域名链接
      max_depth: 10 # 从入口最多深入几层链接
      max_pages: 15 # 最多访问多少页 (防爆)
      # max_items: 100               # 最多提取多少条记录
      # include_page_url: true       # 每条记录加上 _page 字段 (来源页面)
      targets:
        item: "css:.quote" # 目标节点: 每个匹配项作为一条记录 (不写=整页一条)
        fields: # 字段全部支持链式抽取
          quote:
            chain: # 多步链: CSS 选中 -> 正则去掉首尾中文引号
              - "css:.text"
              - "regex:^“(.+)”$"
          author:
            chain: "xpath:.//small[@class='author']/text()" # XPath 直接取文本
          tags:
            chain: "css:.tag"
            all: true # 合并所有匹配
          author_id:
            chain:
              - "css:a[href*='/author/']" # CSS 选中作者链接 <a>
              - "xpath:./@href" # XPath 取 href 属性值
              - "regex:/author/(.+)$" # 正则截取作者 ID
    output:
      format: txt
      separator: " | "

  # ======== 示例 4: mibei77 —— 首页文章列表 -> 文章页订阅链接 (纯静态站) ========
  # 页面结构 (2026-10-25 实测):
  #   首页列表:  每篇文章标题为 <h2 class="item-heading"><a href="https://www.mibei77.com/776.html">标题</a></h2>
  #   文章详情:  正文容器 <div class="theme-box wp-posts-content"> 内含两个订阅地址。
  #              注意: 这两个地址是"纯文本 URL", 不是 <a> 超链接 (页面源码里是 <p>https://...</p>),
  #              所以不能用 selector + attr: href 去取, 只能用正则从容器文本里抠出来:
  #                v2ray 订阅:  https://aa.mibei77.com/202610/10.2564baghl.txt   (.txt 结尾)
  #                clash 订阅:  https://aa.mibei77.com/202610/1025Clashiwr.yaml  (.yaml 结尾)
  - name: mibei77
    title: "mibei77 每日节点订阅链接"
    enabled: true
    # 入口: 首页。当前首页(含置顶)约 12 篇文章。
    # 想多抓历史文章就改用 start_urls 把分页列进去 (分页地址为 /page/2 ~ /page/15, 无尾斜杠):
    # start_urls:
    #   - https://www.mibei77.com/
    #   - https://www.mibei77.com/page/2
    #   - https://www.mibei77.com/page/3
    start_urls:
      - https://www.mibei77.com/
      - https://www.yudou789.top/
    render: static # 实测无需 JS 渲染, 直接请求 HTML 即可 (比 auto 少一次校验, 更快更稳)
    levels:
      # ---- 第一级: 首页列表页, 每篇文章标题 (.item-heading 下的 a) 作为一个条目 ----
      - name: home-list
        item_selector: ".item-heading" # 每个标题块 <h2 class="item-heading"> 是一项
        # limit: 10                     # 只抓前 N 篇; 不写 = 处理本页全部条目
        fields:
          # 文章链接: 取 <a> 的 href; href 会自动补全为绝对地址。
          # link 只作为第二级的入口 (url_field), 不出现在最终输出里
          link:
            selector: "a" # 即 ".item-heading 下的 a 元素"
            attr: "href" # -> https://www.mibei77.com/776.html
          # 如需在输出里带上标题/文章链接, 加回 title 字段并把下面
          # output 的 inherit_fields 改回 true (或不写, 默认 true)
      # ---- 第二级: 文章详情页, 从正文容器里抠出两个订阅地址 ----
      - name: post
        url_field: link # 以上一级的 link 字段作为本层入口 (逐篇打开文章页)
        fields:
          # ⚠ 这里必须用链式 chain 写法, 不能用 selector + regex 简写:
          #   selector + regex 在正则"不匹配"时会原样保留整段容器文本,
          #   而 chain 写法无匹配时结果为空值 -> 输出时该字段被自动跳过。
          #
          # v2ray 订阅 (.txt 结尾)。链式分两步:
          #   1) css:   选中正文容器, 取其全部可见文本 (纯文本 URL 也包含在内)
          #   2) regex: 从文本中匹配 "http(s)://开头、.txt 结尾" 的那一段
          #      \S+   = URL 中间不能有空白。容器文本以空格分隔段落文字,
          #              恰好把 URL 和周围中文隔开, 所以 \S+ 能精确框住整个 URL
          #      +?    = 非贪婪, 匹配到第一个 .txt 即停, 防止跨段吞字
          #      正则步骤用单引号包裹, 避免 YAML 双引号字符串的反斜杠转义问题
          # ⚠ 故意不设 default: 个别纯推广文没有订阅链接, 字段留空后
          #   整行会被输出逻辑跳过, 不会产生垃圾行
          txt_link:
            chain:
              - "css:.theme-box.wp-posts-content"
              - 'regex:https?://\S+?\.txt'
          # Clash 订阅 (.yaml 结尾), 提取逻辑同上
          yaml_link:
            chain:
              - "css:.theme-box.wp-posts-content"
              - 'regex:https?://\S+?\.yaml'
          # 备注: 若以后出现 .text 结尾的地址, 把正则改成 'regex:https?://\S+?\.(?:txt|text)'
    output:
      format: txt
      # 字段之间用换行分隔 -> 每个链接独占一行, 不用 " | " 之类的连接符
      separator: "\n"
      inherit_fields: false # 不拼接第一级字段: 输出里只有订阅链接本身
      # 最终输出形态 (每篇文章贡献 2 行):
      #   https://aa.mibei77.com/202610/…txt
      #   https://aa.mibei77.com/202610/…yaml
      # with_keys: true                      # 想要行内带字段名 (txt_link: …) 时打开
