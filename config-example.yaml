# ============================================================
# 精简起步模板 —— 新站点配置从这里复制。
# 完整注释的示例见 config.yaml, 字段详解见 README.md
# ============================================================

# ---------- 全局设置 ----------
delay: 1.0        # 相邻两次请求的间隔秒数 (建议不小于 1)
timeout: 120      # 单个请求超时 (秒)
retry: 2          # 瞬时失败(超时/5xx/429)的重试次数
timezone_offset: 8

# ---------- Gist 输出 ----------
gist:
  id: ""          # 留空: 首次运行自动创建, ID 写入 gist_id.txt
  description: "多站点抓取结果"

# ---------- 站点列表 ----------
sites:
  # 模式 A: levels 多级抓取 (列表页 -> 详情页)
  - name: my-site
    title: "示例站点"
    enabled: true
    start_url: https://example.com/
    render: auto   # auto: 静态抓不到目标内容时自动切 Playwright 动态渲染
    # headers:     # Cookie 等敏感值用 ${环境变量} 注入, 配置为仓库 Secret
    #   Cookie: "${MY_COOKIE}"
    levels:
      - name: list
        item_selector: ".item"
        limit: 20
        fields:
          title: "h3 a"
          link:
            selector: "a"
            attr: "href"
      - name: detail
        url_field: link
        fields:
          content:
            selector: ".content"
            max_length: 500
    output:
      format: txt
      separator: " | "

  # 模式 B: 递归抓取 (未知层级, 与 levels 二选一)
